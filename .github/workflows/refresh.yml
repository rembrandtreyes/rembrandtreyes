name: refresh profile

on:
  schedule:
    - cron: "17 13 * * *" # daily, 6:17am Phoenix
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/refresh.yml", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#d9622b&color_dots=#efe9df,#f6d3bb,#eea77c,#e07a45,#b24a18
            dist/snake-dark.svg?color_snake=#f08a4b&color_dots=#1c1a17,#4a2a17,#7a3d1a,#b8561f,#f08a4b
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  recent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update recently pushed repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: scripts/update-recent.sh
      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh recently pushed"
          git push
